[package]
name = "unicoin"
version = "0.1.0"
edition = "2021"
authors = ["Unicoin Team"]
description = "Universal Coin - The Ultimate Secure Decentralized Cryptocurrency"
license = "MIT"
repository = "https://github.com/unicoin/unicoin"
keywords = ["cryptocurrency", "blockchain", "defi", "privacy", "security"]

[dependencies]
# Core blockchain dependencies
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
sha2 = "0.10"
blake3 = "1.5"
secp256k1 = { version = "0.28", features = ["rand"] }
ed25519-dalek = "2.0"
ring = "0.17"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"

# Networking
libp2p = { version = "0.53", features = ["full"] }
quinn = "0.10"
rustls = "0.21"

# Database
sled = "0.34"
rocksdb = "0.21"

# Async runtime
futures = "0.3"
async-trait = "0.1"

# Utilities
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
base64 = "0.21"
rand = "0.8"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

# API dependencies
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "compression", "trace"] }
futures = "0.3"
serde_json = "1.0"
toml = "0.8"
num_cpus = "1.0"

# Testing
[dev-dependencies]
criterion = "0.5"
proptest = "1.0"

[[bench]]
name = "blockchain_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
